<input type="text" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>

<ul id="notifications"></ul>  ✅ REQUIRED 

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>

<script>
    let connection = null;

    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const res = await fetch(" https://auth-service-411f.onrender.com/api/auth/login", { // ✅ change this
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
            alert("Login failed");
            return;
        }

        const data = await res.json();

        if (!data.token) {
            alert("Invalid response");
            return;
        }

        localStorage.setItem("token", data.token);
        alert("Login successful");

        startSignalR();
    }

    function startSignalR() {
        if (connection) return;

        const token = localStorage.getItem("token");
        if (!token) return;

        connection = new signalR.HubConnectionBuilder()
            .withUrl("https://product-service-ow6k.onrender.com/notificationHub", {
                accessTokenFactory: () => token
            })
            .withAutomaticReconnect()
            .build();

        connection.on("ReceiveNotification", function (data) {
            const list = document.getElementById("notifications");

            const item = document.createElement("li");
            item.innerText = `${data.type}: ${data.name} (${data.price})`;

            list.prepend(item);
        });

        async function loadNotifications() {
            const res = await fetch("https://product-service-ow6k.onrender.com/api/products/notifications", {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            });

            const data = await res.json();

            data.forEach(n => {
                const list = document.getElementById("notifications");

                const item = document.createElement("li");
                item.innerText = n.message;

                list.appendChild(item);
            });
        }

        connection.start()
            .then(() => {
                console.log("✅ Connected to SignalR");
                loadNotifications(); // ✅ FIX
            })
            .catch(err => console.error("❌ Error:", err));
    }

    window.onload = function () {
        if (localStorage.getItem("token")) {
            startSignalR();
        }
    };
</script>
